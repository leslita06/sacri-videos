<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SACRI : films courts</title>
<link rel="icon" href="logo.png">
<style>
:root{--or:#E95B0F;--gr:#878480;--ink:#1A1918;--soft:#F4F3F1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--soft);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:#fff;border-bottom:4px solid var(--or)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;gap:16px;height:76px}
.top img{height:46px;width:auto}
.top span{color:var(--gr);font-weight:600;font-size:15px}
.hero{padding:40px 0 8px}
h1{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--gr);margin-top:8px;font-size:17px}
.tabs{display:flex;gap:8px;margin:24px 0 8px}
.tabs button{border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:16px 0 56px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.card video{display:block;width:100%;background:#000;aspect-ratio:9/16}
body.sq .card video{aspect-ratio:1/1}
.meta{padding:16px 18px 20px}
.meta b{display:block;font-size:18px}
.meta small{display:block;color:var(--gr);margin-top:4px;font-size:14px}
.meta a{display:inline-block;margin-top:12px;color:var(--or);font-weight:700;text-decoration:none;font-size:14px}
footer{background:var(--ink);color:#cfccc8;font-size:14px;padding:28px 0}
footer a{color:#fff}
@media(max-width:900px){.grid{grid-template-columns:1fr;max-width:460px;margin:0 auto}}
</style>
</head>
<body>
<header><div class="wrap top"><img src="logo.png" alt="SACRI" width="92" height="46"><span>Films courts</span></div></header>
<main class="wrap">
  <section class="hero">
    <h1>Trois films de 15 secondes</h1>
    <p>Pour les statuts WhatsApp, les Reels et les publications.</p>
    <div class="tabs" role="group" aria-label="Format">
      <button type="button" data-f="9x16" aria-pressed="true">Vertical 1080 x 1920</button>
      <button type="button" data-f="1x1" aria-pressed="false">Carré 1080 x 1080</button>
    </div>
  </section>
  <section class="grid" id="grid"></section>
</main>
<footer><div class="wrap">SACRI, Bd de Marseille, face SIVOA, Abidjan. <a href="https://www.sacri-ci.com" target="_blank" rel="noopener">www.sacri-ci.com</a></div></footer>
<script>
var V='20261119';
var F=[['01-machine-stihl','Une machine STIHL','La MS 661 C-M, puis SACRI représentant exclusif STIHL'],
       ['02-entretien-atelier','L\u2019entretien en atelier','Pièces, lubrifiants et révision avant la saison'],
       ['03-piece-sur-whatsapp','Une pièce ? Une photo sur WhatsApp','Le client envoie la photo, un conseiller répond']];
function draw(fmt){
  document.body.classList.toggle('sq',fmt==='1x1');
  document.getElementById('grid').innerHTML=F.map(function(f){
    var src='videos/SACRI_video_'+f[0]+'_'+fmt+'.mp4?v='+V, pos='videos/SACRI_video_'+f[0]+'_'+fmt+'.jpg?v='+V;
    return '<article class="card"><video controls playsinline muted preload="metadata" poster="'+pos+'"><source src="'+src+'" type="video/mp4"></video>'+
      '<div class="meta"><b>'+f[1]+'</b><small>'+f[2]+'</small><a href="'+src+'" download>Télécharger le fichier</a></div></article>';
  }).join('');
}
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});draw(b.dataset.f);});});
draw('9x16');
</script>
</body>
</html>
